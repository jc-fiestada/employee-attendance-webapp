<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Insert Employee</title>
    <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

    <div class="page-container">
        <header class="admin-header">
            <div class="header-left">
                <h1 class="admin-title">ADMIN</h1>
            </div>
            <div class="header-center">
                <p class="page-label">Create New Employee</p>
            </div>
        </header>

        <div class="main-content-wrapper">

            <aside class="sidebar" id="sidebar">
                <button class="toggle-btn" id="toggleSidebar">☰</button>
                <nav class="sidebar-nav">
                    <ul>
                        <li class="sidebar-item">
                            <a href="./main.html">
                                <span class="icon">🏠</span>
                                <span class="text">Home</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a href="./insert.html">
                                <span class="icon">➕</span>
                                <span class="text">Insert</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a href="./attendance.html">
                                <span class="icon">📅</span>
                                <span class="text">Attendance</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </aside>

            <div class="main-area">
                <main class="admin-main">
                    <section class="employee-layout">

                        <form id="employeeForm" class="employee-grid">

                            <div class="card classification">
                                <h3>Classification</h3>

                                <label>Gender</label>
                                <select id="sex" required>
                                    <option value="">Select Sex</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>

                                <label>Department</label>
                                <select id="department" required>
                                    <option value="">Select Department</option>
                                    <option value="it">IT</option>
                                    <option value="finance">Finance</option>
                                    <option value="marketing">Marketing</option>
                                    <option value="customer service">Customer Service</option>
                                    <option value="department manager">Department Manager</option>
                                </select>
                            </div>

                            <div class="card photo-box">
                                <h3>Employee Photo</h3>

                                <div class="photo-preview" id="photoPreview">
                                    <span>No Photo</span>
                                </div>

                                <input type="file" id="photoInput" name="photo" accept="image/*" hidden />

                                <button type="button" class="btn-secondary" id="uploadBtn">
                                    Add Photo
                                </button>
                            </div>

                            <div class="card details">
                                <h3>Employee Details</h3>

                                <label>Full Name</label>
                                <input id="fullName" type="text" required />

                                <label>Gmail Address</label>
                                <input id="userGmail" type="email" required />
                            </div>

                            <div class="submit-row">
                                <button id="submit-employee-btn" type="submit" class="btn-primary">Create Employee</button>
                            </div>

                        </form>

                    </section>

                </main>
            </div>

        </div>

        <footer class="admin-footer">
            <p>Employee Monitoring System</p>
        </footer>

    </div>

    <script type="module" src="../../scripts/shared/sidebar.ts"></script>
    <script type="module" src="../../scripts/insertPage.ts"></script>
</body>
</html>
