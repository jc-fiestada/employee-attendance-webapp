<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Main</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>

<div class="modal" id="deleteModal">
    <div class="modal-box">
        <p>Are you sure you want to delete this employee?</p>
        <div class="modal-actions">
            <button id="confirmDelete">Yes</button>
            <button class="closeModal">No</button>
        </div>
    </div>
</div>

<div class="modal" id="updateModal">
    <div class="modal-box">
        <select id="updateField">
            <option value="name">Name</option>
            <option value="sex">Sex</option>
            <option value="department">Department</option>
        </select>

        <input type="text" id="updateValue" placeholder="Enter new value" />

        <select id="updateSex" style="display:none;">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <select id="updateDepartment" style="display:none;">
            <option value="it">IT</option>
            <option value="marketing">HR</option>
            <option value="finance">Finance</option>
            <option value="customer service">Customer Service</option>
            <option value="department manager">Department Manager</option>
        </select>

        <div class="modal-actions">
            <button id="confirmUpdate">Update</button>
            <button class="closeModal">Cancel</button>
        </div>
    </div>
</div>


<body>

    <div class="page-container">

        <header class="admin-header">
            <div class="header-left">
                <h1 class="admin-title">ADMIN</h1>
            </div>
            <div class="header-center">
                <p class="page-label">Employees</p>
            </div>
        </header>

        <div class="main-content-wrapper">

            <aside class="sidebar" id="sidebar">
                <button class="toggle-btn" id="toggleSidebar">☰</button>
                <nav class="sidebar-nav">
                    <ul>
                        <li class="sidebar-item">
                            <a href="./main.html">
                                <span class="icon">🏠</span>
                                <span class="text">Home</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a href="./insert.html">
                                <span class="icon">➕</span>
                                <span class="text">Insert</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a href="./attendance.html">
                                <span class="icon">📅</span>
                                <span class="text">Attendance</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </aside>

           <main class="admin-main">

                <div class="table-section">
                    <div class="table-controls">
                        <select id="department-search" class="department-filter">
                            <option value="all">All Departments</option>
                            <option value="it">IT</option>
                            <option value="marketing">Marketing</option>
                            <option value="finance">Finance</option>
                            <option value="customer service">Customer Service</option>
                            <option value="department manager">Department Manager</option>
                        </select>

                        <input id="name-search" type="text" class="search-input" placeholder="Search employee..." />
                    </div>

                    <div class="table-container">
                        <div class="table-header">
                            <div>Photo</div>
                            <div>Name</div>
                            <div>Sex</div>
                            <div>Gmail</div>
                            <div>Department</div>
                            <div>ID</div>
                            <div>Actions</div>
                        </div>

                        <div id="employee-container" class="table-body">
                            
                            <div id="" class="table-row">
                                <div><img src="https://via.placeholder.com/45" /></div>
                                <div>Juan Dela Cruz</div>
                                <div>Male</div>
                                <div>juan@gmail.com</div>
                                <div>IT</div>
                                <div>EMP-001</div>
                                <div class="actions">
                                    <button class="upload-btn">Upload</button>
                                    <button class="update-btn">Update</button>
                                    <button class="delete-btn">Delete</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>


        </div>

        <footer class="admin-footer">
            <p>Employee Monitoring System</p>
        </footer>

    </div>

    <script type="module" src="../../scripts/shared/sidebar.ts"></script>
    <script type="module" src="../../scripts/mainPage.ts"></script>
</body>
</html>
