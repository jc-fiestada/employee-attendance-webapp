<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Scanner</title>
    <link rel="stylesheet" href="../../css/employee.css">
</head>
<body>

<div class="page-container">
    <header class="employee-header">
        <h1>EMPLOYEE</h1>
    </header>

    <main class="employee-main">

        <div class="scanner-wrapper">

            <div class="scanner-instructions">
                <h2>QR Attendance Scanner</h2>
                <p>Please use your provided ID and present the QR code to the camera.</p>
            </div>

            <div class="camera-container">

                <video id="qr-video"> </video>

                <div id="video-error" class="camera-error hidden">
                    <p>No camera detected or permission denied.</p>
                </div>

            </div>

        </div>

    </main>

    <footer class="employee-footer">
        <p>Employee Monitoring System</p>
    </footer>

</div>

<script type="module" src="../../scripts/employeeMain.ts"> </script>

</body>
</html>
